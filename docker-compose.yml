name: basic-ai-chat

services:
  postgres:
    image: postgres:16-alpine
    container_name: basic-ai-chat-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: test1
    ports:
      - "6432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d test1"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
